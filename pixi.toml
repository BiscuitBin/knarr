[workspace]
name = "knarr"
channels = ["conda-forge"]
# CI is linux-64; the maintainer is osx-arm64. linux-aarch64 is the image a
# local build makes on that host for its arm64 kind node (ticket 50). Another
# platform joins when a claim verifies it.
platforms = ["linux-64", "osx-arm64", "linux-aarch64"]
requires-pixi = ">=0.81.0"

# The default feature: the compiler and every repository tool the gate runs.
# Exact pins throughout; pixi.lock holds the hashes.
[dependencies]
# conda-forge's gleam depends on no erlang; the otp feature supplies it.
gleam = "==1.19.0"
just = "==1.58.0"
prek = "==0.5.5"
typos = "==1.51.1"
lychee = "==0.24.2"
taplo = "==0.10.0"
markdownlint-cli2 = "==0.23.3"
actionlint = "==1.7.12"
shellcheck = "==0.11.0"
# The gate checkers in scripts/checks/ and their tests (Decision 0004).
python = "==3.14.8"
pytest = "==9.1.1"
ruff = "==0.16.10"
# The chart checks in scripts/checks/chart.py lint and render the Helm chart
# (Decision 0015); kustomize canonicalises the render for the chart tests and
# patches it for the wrong-CA case.
kubernetes-helm = "==4.3.0"
kustomize = "==5.8.2"

# The single owner of the OTP version: pixi, CI and both Dockerfile stages read
# this pin through pixi.lock.
[feature.otp.dependencies]
erlang = "==29.1.1"

# Local-cluster tooling, kept out of the default environment so the gate jobs
# do not install it.
[feature.cluster.dependencies]
kubernetes-kind = "==0.33.0"
# 1.36, one minor ahead of the 1.35 cluster: 1.34.3 has no linux-aarch64 build.
kubernetes-client = "==1.36.0"
tilt = "==0.37.8"

# The image scan the audit workflow runs (Decision 0014). Kept out of the
# default environment like the cluster tools; grype brings no dependencies.
[feature.audit.dependencies]
grype = "==0.120.1"

# One solve group: every environment gets the same erlang build and the same
# openssl, so what the default environment proves about TLS holds for the
# runtime image.
[environments]
default = { features = ["otp"], solve-group = "default" }
cluster = { features = ["otp", "cluster"], solve-group = "default" }
runtime = { features = ["otp"], no-default-feature = true, solve-group = "default" }
audit = { features = ["audit"], no-default-feature = true, solve-group = "default" }

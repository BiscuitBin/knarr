# The only typos configuration. Adapted from libpawdoku's _typos.toml.

[files]
# The environment and tool directories hold binaries, and the lockfile and
# Gleam's build output carry hashes and generated names.
# The vendored Allium skills are upstream bytes pinned by skills-lock.json, and
# the Kubernetes schemas are upstream bytes pinned by their sources.json.
extend-exclude = [
  ".pixi/",
  ".tools/",
  "pixi.lock",
  "build/",
  "ai_tmp/",
  ".agents/skills/allium/",
  ".agents/skills/distill/",
  ".agents/skills/elicit/",
  ".agents/skills/propagate/",
  ".agents/skills/tend/",
  ".agents/skills/weed/",
  ".agents/skills/witness/",
  "scripts/schemas/kubernetes/",
]

[default]
# Kubernetes ends a generated pod or node name with five characters from its
# vowel-free alphabet (apimachinery's rand.String), as in ticket 15's
# transcripts: exp4-absent-65c847859b-pn74f, ng-a-k9bql. They are not words.
# docker pull prints each layer's 12-hex short id before its progress, as in
# ticket 37's pull.txt: 61f70ba02274: Pull complete. It is not a word either.
extend-ignore-re = ["-[bcdfghjklmnpqrstvwxz2456789]{5}\\b", "\\b[0-9a-f]{12}: "]

[default.extend-words]
# AIMD: additive increase, multiplicative decrease (docs/DEFERRED.md).
aimd = "aimd"
# JUXT Ltd, the copyright holder of the vendored Allium skills.
juxt = "juxt"

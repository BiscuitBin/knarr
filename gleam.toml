name = "knarr"
version = "0.2.0"
description = "A Kubernetes controller that biases Deployment scale-down away from busy worker pods."
licences = ["Apache-2.0"]
target = "erlang"

[erlang]
application_start_module = "application_ffi"
# httpc and ssl, which the k8s_http adapter calls, start with the application.
extra_applications = ["inets", "ssl"]

[dependencies]
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
mist = ">= 6.0.3 and < 7.0.0"
prometheus = ">= 6.1.3 and < 7.0.0"
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"

[dev-dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
qcheck = ">= 1.0.5 and < 2.0.0"
birdie = ">= 2.0.2 and < 3.0.0"
glinter = ">= 2.19.2 and < 3.0.0"

# glinter, run by `just lint-gleam` inside `just check`. Without `include` it
# lints src/ alone.
[tools.glinter]
include = ["src/", "test/"]
warnings_as_errors = true

[tools.glinter.ignore]
# gleeunit finds every public `_test` function by its name, so no module ever
# imports one. The helper modules beside them keep the rule.
"test/**/*_test.gleam" = ["unused_exports"]

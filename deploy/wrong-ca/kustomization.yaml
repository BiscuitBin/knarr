# The wrong-CA variant of the base (ticket 14): the reconciler is given a CA
# the apiserver does not chain to, from the ConfigMap knarr-wrong-ca that the
# evidence script creates from a throwaway certificate. Nothing PEM is
# committed. The expected outcome is a visible unknown_ca and no success.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - path: patch.json

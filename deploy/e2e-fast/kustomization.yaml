# The e2e-fast variant of the base (ticket 33): short intervals, so a scale-in
# round waits seconds rather than minutes for the load's annotations. Rate and
# burst stay at the defaults, so budget's 5·W + 10 bound holds as stated. Since
# helm-chart ticket 03 the KEDA harness installs the chart with
# fixtures/chart-values/e2e-fast.yaml instead, and its restart phase runs the
# chart's defaults. This variant stays only as the reference test_chart.py holds
# that values file's intervals to, until the kustomize tree is retired.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - path: patch.json

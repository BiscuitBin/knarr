# The release overlay (Decision 0012): deploy/base with the published image,
# pinned by digest, and the pull policy IfNotPresent (the base's Never is for
# images loaded into kind). It changes nothing else. RBAC is the base's: one
# install per namespace (OVERVIEW §9.18), and the Role's verbs and the
# RoleBinding belong in the base. `just deployment-check` renders both and
# fails on any other difference.
# The digest is the latest pinned release's; ticket 37 pinned the first,
# 0.1.0's. A release's digest exists only once its run has pushed, so
# `just release-pin sha256:<64 hex>` pins it on main after the tag: at a
# release's own tag this file still holds the previous digest. An install
# checks out the tag, runs `just release-pin sha256:<64 hex>` there with the
# run's digest, and applies this overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
images:
  - name: knarr
    newName: ghcr.io/steven-cutting/knarr
    digest: sha256:989cb9e44df4b97960e68371c1ae8bddcd29db99d65bbd09b663776665c01bc9
patches:
  - path: pull-policy.yaml
    target:
      kind: Deployment
      name: knarr

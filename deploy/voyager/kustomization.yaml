# The voyager variant of the base (ticket 52): opt-in Erlang distribution so
# the Voyager desktop app can inspect knarr on this worktree's kind cluster.
# epmd and the distribution listener bind 127.0.0.1 on fixed ports, reached
# only through `just voyager-forward`. The cookie arrives in ERL_ZFLAGS from
# the knarr-voyager Secret, which `just voyager-deploy` creates; no Secret is
# rendered here. Nothing else deploys this variant.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - path: patch.json

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Repository gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just check

  cluster-smoke:
    name: Kind smoke (non-required)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      KNARR_CLUSTER: kind
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cluster: "true"
      - run: just deployment-check
      - run: just cluster-up
      - run: just image-build
      - run: just image-check
      - run: just deploy
      - run: just smoke
      - if: failure()
        run: just cluster-diagnostics
      - if: always()
        run: just cluster-down

  # Ticket 29's fake worker on kind: its image with a real SIGTERM to PID 1,
  # then several replicas set to mixed states through control, read back from
  # status, and two of them deleted so their kill records reach the collector.
  # Non-required, like the smoke job, and never in needs below.
  fake-worker-smoke:
    name: Kind fake worker smoke (non-required)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      KNARR_CLUSTER: kind
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cluster: "true"
      - run: just cluster-up
      - run: just fake-worker-image-build
      - run: just fake-worker-image-check
      - run: just fake-worker-deploy
      - run: just fake-worker-smoke
      - if: failure()
        run: just cluster-diagnostics
      - if: always()
        run: just cluster-down

  cluster-kwok:
    name: Kwok readiness (non-required)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      KNARR_CLUSTER: kwok
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cluster: "true"
      - run: just deployment-check
      - run: just cluster-up
      - run: just cluster-ready
      - if: failure()
        run: just cluster-diagnostics
      - if: always()
        run: just cluster-down

  # Ticket 14's S1 proof: the in-cluster client on kind, including the token
  # rotation wait of about ten minutes and the wrong-CA negative case. It is
  # the committed evidence's source on native linux/amd64, where the ARM host
  # cannot build the image. Non-required, like the smoke job, and never in
  # needs below.
  cluster-s1:
    name: Kind S1 client proof (non-required)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      KNARR_CLUSTER: kind
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cluster: "true"
      - run: sh .scratch/bootstrap/evidence/14/tls/run.sh "$PWD" "$RUNNER_TEMP/tls"
      - run: sh .scratch/bootstrap/evidence/14/s1-kind.sh "$PWD" "$RUNNER_TEMP/s1-kind"
      - run: sh .scratch/bootstrap/evidence/14/wrong-ca.sh "$PWD" "$RUNNER_TEMP/wrong-ca"
      - if: failure()
        run: just cluster-diagnostics
      - if: always()
        run: just cluster-down

  # This is the sole status check intended for branch protection. Only required
  # gate jobs belong in needs. Keep the initial kind and kwok jobs out (tickets
  # 10 and 13); kind needs a stated period of stability before becoming required.
  # Never include the separate audit here.
  check:
    name: check
    needs: [gate]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every gate job to succeed
        env:
          PASSED: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: test "$PASSED" = true

name: S1 proof

# Ticket 14's S1 proof: the in-cluster client on kind, including the token
# rotation wait of about ten minutes and the wrong-CA negative case. It is
# the committed evidence's source on native linux/amd64, where the ARM host
# cannot build the image. Non-required, like ci.yml's smoke job, and never in
# ci.yml's check job. The transcripts under .scratch/bootstrap/evidence/14/
# are committed, and the proof cannot run faster than the projected token's
# 600 s lifetime, so this workflow runs only when the paths it proves change,
# or on workflow_dispatch, whose log is where a fresh transcript is cut from.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/s1-proof.yml
      - .github/actions/setup/**
      - .scratch/bootstrap/evidence/14/**
      - Dockerfile
      - .dockerignore
      - Justfile
      - deploy/base/**
      - deploy/wrong-ca/**
      - src/knarr/s1_probe.gleam
      - src/knarr/s1_probe_ffi.erl
      - src/knarr/k8s_client.gleam
      - src/knarr/k8s_http.gleam
      - src/knarr/k8s_http_ffi.erl
      - src/knarr/token.gleam
      - src/knarr/application_ffi.erl
      - scripts/checks/cluster.py
  push:
    branches: [main]
    paths:
      - .github/workflows/s1-proof.yml
      - .github/actions/setup/**
      - .scratch/bootstrap/evidence/14/**
      - Dockerfile
      - .dockerignore
      - Justfile
      - deploy/base/**
      - deploy/wrong-ca/**
      - src/knarr/s1_probe.gleam
      - src/knarr/s1_probe_ffi.erl
      - src/knarr/k8s_client.gleam
      - src/knarr/k8s_http.gleam
      - src/knarr/k8s_http_ffi.erl
      - src/knarr/token.gleam
      - src/knarr/application_ffi.erl
      - scripts/checks/cluster.py

permissions: {}

concurrency:
  group: s1-proof-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cluster-s1:
    name: Kind S1 client proof (non-required)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      KNARR_CLUSTER: kind
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cluster: "true"
      - run: sh .scratch/bootstrap/evidence/14/tls/run.sh "$PWD" "$RUNNER_TEMP/tls"
      - run: sh .scratch/bootstrap/evidence/14/s1-kind.sh "$PWD" "$RUNNER_TEMP/s1-kind"
      - run: sh .scratch/bootstrap/evidence/14/wrong-ca.sh "$PWD" "$RUNNER_TEMP/wrong-ca"
      - if: failure()
        run: just cluster-diagnostics
      - if: always()
        run: just cluster-down

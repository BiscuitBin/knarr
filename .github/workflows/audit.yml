name: Audit

# Remote availability and published advisories change without a commit. This
# workflow is separate from the required gate.
on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: External links
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just links-audit
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # OSV.dev's advisories for the hex packages manifest.toml locks and for the
  # OTP release pixi.toml pins (Decision 0014).
  hex-advisories:
    name: Hex advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just hex-audit

  # grype over the image the Dockerfile builds, the same linux/amd64 build the
  # kind smoke job runs. It never pushes the image. The image scan reads the
  # image's OS packages only, so a second scan copies the runtime environment
  # out of the image and reads its conda packages as a directory: erlang, its
  # openssl and zlib (Decision 0014, ticket 45).
  image-scan:
    name: Image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          audit: "true"
      - id: build
        run: just image-build
      - run: just image-scan
      # Runs after a red OS-package scan too, but not without an image.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: just runtime-scan
